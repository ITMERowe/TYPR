name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        # Builds the app and the tests. Timing tests measure real time and are too noisy on shared CI machines.
        run: dotnet test tests/TYPR.Tests/TYPR.Tests.csproj -c Release --filter "Category!=Timing"

      - name: Publish
        run: dotnet publish TYPR.csproj -p:PublishProfile=win-x64

      - name: Upload TYPR.exe
        uses: actions/upload-artifact@v4
        with:
          name: TYPR-win-x64
          path: publish/win-x64/TYPR.exe
          if-no-files-found: error
          retention-days: 14

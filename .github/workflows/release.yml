name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use semantic version format vX.Y.Z (received '$tag')."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish portable Windows x64 app
        run: dotnet publish TYPR.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false -o artifacts/portable

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item artifacts/portable/TYPR.exe artifacts/release/TYPR-Portable-win-x64.exe

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at '$iscc'."
          }
          & $iscc installer/TYPR.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts/release -File | Sort-Object Name
          foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($asset.Name)" | Add-Content -Encoding ascii artifacts/release/SHA256SUMS.txt
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/*

name: Release

# Push a vX.Y.Z tag to publish a release. CHANGELOG.md must have a "## X.Y.Z" section first.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version and release notes
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use semantic version format vX.Y.Z (received '$tag')."
          }

          # The CHANGELOG section for this version, without its heading, becomes the release notes.
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[?$([regex]::Escape($version))\]?(\s|$)") { $start = $i + 1; break }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no '## $version' section. Add it before tagging."
          }
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { $end = $i; break }
          }
          if ($end -le $start) {
            throw "CHANGELOG.md section '## $version' is empty."
          }
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          ($lines[$start..($end - 1)] -join "`n").Trim() | Set-Content -Encoding utf8 artifacts/notes.md

          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        # Timing tests measure real time and are too noisy on shared CI machines.
        run: dotnet test tests/TYPR.Tests/TYPR.Tests.csproj -c Release --filter "Category!=Timing"

      - name: Publish TYPR.exe
        run: dotnet publish TYPR.csproj -p:PublishProfile=win-x64 -p:Version=${{ steps.version.outputs.value }}

      - name: Prepare portable exe
        shell: pwsh
        run: Copy-Item publish/win-x64/TYPR.exe artifacts/release/TYPR-Portable-win-x64.exe

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at '$iscc'."
          }
          & $iscc installer/TYPR.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts/release -File | Sort-Object Name
          foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($asset.Name)" | Add-Content -Encoding ascii artifacts/release/SHA256SUMS.txt
          }

      # GitHub's own CLI (preinstalled on the runner) instead of a third-party action with write access.
      # CHANGELOG notes come first; --generate-notes appends the list of merged changes.
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          (Get-ChildItem artifacts/release -File).FullName
          --title "TYPR ${{ steps.version.outputs.value }}"
          --notes-file artifacts/notes.md
          --generate-notes
          --verify-tag

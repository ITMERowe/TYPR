name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64
        run: dotnet publish TYPR.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false -o publish

      - name: Create SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/TYPR.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TYPR.exe" | Out-File -Encoding ascii publish/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/TYPR.exe
            publish/SHA256SUMS.txt
